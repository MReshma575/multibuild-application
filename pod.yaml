apiVersion: v1
kind: Pod
metadata:
  name: multi-app-pod
  labels:
    app: multi-app
spec:
  containers:
  - name: dual-app-container
    image: multi-app:local         # <--- Updated tag
    imagePullPolicy: Never         # <--- Forces Kubernetes to only use the local image
    ports:
    - containerPort: 3000
    - containerPort: 5000

